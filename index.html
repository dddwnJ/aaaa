<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <!-- 폰트 및 아이콘 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #fafafa;
      color: #262626;
      padding-bottom: 75px;
    }

    .page-view {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }
    .page-view.active {
      display: block;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid #dbdbdb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -0.5px;
    }
    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .header-btn {
      background: #efefef;
      border: 1px solid #dbdbdb;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-btn.highlight {
      background: #0095f6;
      color: white;
      border-color: #0095f6;
    }

    /* 스토리 바 */
    .stories-container {
      background: #ffffff;
      border-bottom: 1px solid #dbdbdb;
      padding: 12px 10px;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stories-container::-webkit-scrollbar {
      display: none;
    }
    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 66px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5px;
      position: relative;
    }
    .story-ring.no-story {
      background: #dbdbdb;
    }
    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 2px solid #fff;
    }
    .add-icon-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #0095f6;
      color: #fff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border: 2px solid #fff;
    }
    .story-username {
      font-size: 11px;
      margin-top: 5px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 피드 */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px 0;
    }
    .post-card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      overflow: hidden;
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .post-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .post-user img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .post-user span {
      font-weight: 600;
      font-size: 14px;
    }
    .post-badge-hidden {
      font-size: 10px;
      background: #eee;
      color: #666;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .post-menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #262626;
      padding: 4px;
      font-size: 16px;
    }
    .post-slider-wrap {
      position: relative;
      width: 100%;
      background: #000;
    }
    .post-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .post-slider::-webkit-scrollbar {
      display: none;
    }
    .post-slider img {
      width: 100%;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      scroll-snap-align: start;
    }
    .slide-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      pointer-events: none;
    }
    .post-actions {
      padding: 10px 16px 4px;
      display: flex;
      gap: 16px;
      font-size: 20px;
    }
    .post-actions i {
      cursor: pointer;
    }
    .post-actions .fa-heart.active {
      color: #ed4956;
    }
    .post-likes {
      padding: 0 16px;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #262626;
    }
    .post-body {
      padding: 0 16px 14px;
      font-size: 14px;
    }
    .post-caption {
      margin-top: 4px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .post-date {
      margin-top: 6px;
      font-size: 11px;
      color: #8e8e8e;
    }

    /* 내 프로필 뷰 */
    .profile-header-bar {
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .my-profile-section {
      background: #ffffff;
      padding: 18px 16px 12px;
    }
    .profile-top-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 14px;
    }
    .my-profile-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #dbdbdb;
    }
    .profile-stats {
      display: flex;
      flex: 1;
      justify-content: space-around;
      text-align: center;
    }
    .stat-box .count {
      font-weight: 700;
      font-size: 16px;
      display: block;
    }
    .stat-box .label {
      font-size: 12px;
      color: #737373;
    }
    .profile-bio-wrap {
      margin-bottom: 14px;
    }
    .profile-bio-wrap h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .profile-bio-wrap p {
      font-size: 13px;
      line-height: 1.4;
      color: #262626;
      white-space: pre-line;
    }
    .profile-action-btn-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-profile-edit {
      flex: 2;
      background: #efefef;
      border: none;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-backup {
      flex: 1;
      background: #efefef;
      border: none;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    /* 하이라이트 */
    .highlights-container {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 10px 0 6px;
      border-top: 1px solid #efefef;
    }
    .highlights-container::-webkit-scrollbar {
      display: none;
    }
    .highlight-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 64px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .highlight-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid #dbdbdb;
      padding: 2.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .highlight-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .highlight-circle.add-circle {
      background: #fafafa;
      border: 1px solid #c7c7c7;
      font-size: 20px;
      color: #262626;
    }
    .highlight-title {
      font-size: 11px;
      margin-top: 5px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #262626;
    }

    /* 그리드 피드 */
    .grid-tab-header {
      display: flex;
      border-top: 1px solid #dbdbdb;
      border-bottom: 1px solid #dbdbdb;
      background: #fff;
      margin-top: 6px;
    }
    .grid-tab-item {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 18px;
      border-bottom: 2px solid #262626;
      color: #262626;
      cursor: pointer;
    }
    .profile-grid-feed {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding-top: 3px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #eee;
      cursor: pointer;
      overflow: hidden;
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grid-item .badge-icons {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      color: white;
      font-size: 13px;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }

    /* 하단 네비게이션 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      height: 52px;
      background: #ffffff;
      border-top: 1px solid #dbdbdb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-tab-item {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 100%;
      color: #262626;
      font-size: 22px;
      cursor: pointer;
    }
    .nav-tab-item.active {
      font-weight: 900;
    }
    .nav-profile-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid transparent;
    }
    .nav-tab-item.active .nav-profile-avatar {
      border-color: #262626;
    }

    /* 모달 공통 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid #dbdbdb;
      font-weight: 600;
      text-align: center;
      position: relative;
    }
    .modal-close {
      position: absolute;
      right: 16px;
      top: 14px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 18px;
    }
    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .modal-body input[type="text"], .modal-body input[type="number"], .modal-body input[type="date"], .modal-body textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .modal-body label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: -4px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row > div {
      flex: 1;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: #111;
      cursor: pointer;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .checkbox-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
    }
    .radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-submit {
      background: #0095f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .preview-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0;
    }
    .preview-container img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #dbdbdb;
    }

    /* 스토리 풀스크린 뷰어 */
    .story-viewer-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .story-viewer-modal.active {
      display: flex;
    }
    .story-viewer-content {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 820px;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-bars-wrap {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 310;
    }
    .story-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.35);
      flex: 1;
      border-radius: 2px;
    }
    .story-bar.active {
      background: #ffffff;
    }
    .story-viewer-header {
      position: absolute;
      top: 20px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      z-index: 310;
      font-size: 14px;
    }
    .story-viewer-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .story-viewer-user img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .story-viewer-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .story-nav-prev, .story-nav-next {
      position: absolute;
      top: 60px;
      bottom: 0;
      width: 50%;
      z-index: 305;
      cursor: pointer;
    }
    .story-nav-prev { left: 0; }
    .story-nav-next { right: 0; }

    /* 토스트 알림 */
    .toast-box {
      position: fixed;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      display: none;
    }

    .option-item {
      padding: 14px;
      text-align: center;
      border: none;
      border-bottom: 1px solid #efefef;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
    }
    .option-item.danger {
      color: #ed4956;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- ==================== 1. 홈 뷰 ==================== -->
  <div id="view-home" class="page-view active">
    <header>
      <div class="logo">Instagram</div>
      <div class="nav-actions">
        <button class="header-btn highlight" onclick="openStoryUploadModal('other')">
          <i class="fa-solid fa-circle-plus"></i> 친구 스토리
        </button>
        <button class="header-btn" onclick="openPostUploadModal(false)">
          <i class="fa-regular fa-square-plus"></i> 피드 작성
        </button>
      </div>
    </header>

    <div class="stories-container" id="stories-container"></div>
    <main class="feed-container" id="feed-container"></main>
  </div>


  <!-- ==================== 2. 내 프로필 뷰 ==================== -->
  <div id="view-profile" class="page-view">
    <header>
      <div class="profile-header-bar">
        <i class="fa-solid fa-lock" style="font-size:14px;"></i>
        <span id="page-profile-header-username">my_username</span>
      </div>
      <div class="nav-actions">
        <button class="header-btn highlight" onclick="openPostUploadModal(true)" title="홈에 안 뜨는 과거/내피드 전용 게시물">
          <i class="fa-solid fa-clock-rotate-left"></i> 옛날 게시물 올리기
        </button>
        <button class="header-btn" onclick="openPostUploadModal(false)">
          <i class="fa-regular fa-square-plus"></i> 일반 올리기
        </button>
      </div>
    </header>

    <section class="my-profile-section">
      <div class="profile-top-row">
        <img id="mypage-avatar" class="my-profile-avatar" src="https://via.placeholder.com/150" alt="아바타">
        <div class="profile-stats">
          <div class="stat-box">
            <span class="count" id="mypage-post-count">0</span>
            <span class="label">게시물</span>
          </div>
          <!-- 1000~3000명 사이 팔로워 -->
          <div class="stat-box">
            <span class="count" id="mypage-followers-count">1,842</span>
            <span class="label">팔로워</span>
          </div>
          <!-- 300~400명 사이 팔로잉 -->
          <div class="stat-box">
            <span class="count" id="mypage-following-count">358</span>
            <span class="label">팔로잉</span>
          </div>
        </div>
      </div>

      <!-- 프로필 정보: 이름(볼드) + 소개글 -->
      <div class="profile-bio-wrap">
        <h3 id="mypage-name">이름 (닉네임)</h3>
        <p id="mypage-bio">소개글이 없습니다.</p>
      </div>

      <div class="profile-action-btn-wrap">
        <button class="btn-profile-edit" onclick="openProfileModal()">프로필 편집</button>
        <button class="btn-backup" onclick="exportDataBackup()" title="모든 데이터 파일로 저장">백업</button>
        <button class="btn-backup" onclick="document.getElementById('backup-file-input').click()" title="백업 파일 불러오기">복구</button>
        <input type="file" id="backup-file-input" accept=".json" style="display:none;" onchange="importDataBackup(event)">
      </div>

      <!-- 하이라이트 영역 -->
      <div class="highlights-container" id="highlights-container"></div>
    </section>

    <div class="grid-tab-header">
      <div class="grid-tab-item"><i class="fa-solid fa-table-cells"></i></div>
    </div>

    <!-- 3열 그리드 피드 -->
    <div class="profile-grid-feed" id="profile-grid-feed"></div>
  </div>


  <!-- ==================== 하단 네비게이션 ==================== -->
  <nav class="bottom-nav">
    <div class="nav-tab-item active" id="tab-btn-home" onclick="switchView('home')" title="홈">
      <i class="fa-solid fa-house"></i>
    </div>
    <div class="nav-tab-item" onclick="dummyTab('검색')" title="검색">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="nav-tab-item" onclick="openPostUploadModal(false)" title="피드 작성">
      <i class="fa-regular fa-square-plus"></i>
    </div>
    <div class="nav-tab-item" onclick="dummyTab('릴스')" title="릴스">
      <i class="fa-solid fa-clapperboard"></i>
    </div>
    <div class="nav-tab-item" id="tab-btn-profile" onclick="switchView('profile')" title="내 프로필">
      <img id="nav-avatar" class="nav-profile-avatar" src="https://via.placeholder.com/150" alt="프로필">
    </div>
  </nav>


  <!-- ==================== 모달 목록 ==================== -->

  <!-- 피드 작성 모달 -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="upload-modal-title">새 피드 작성</span>
        <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
      </div>
      <div class="modal-body">
        <label>사진 선택 (여러 장 가능, 고화질 최적 압축)</label>
        <input type="file" id="post-images" accept="image/*" multiple onchange="handleFeedImageSelect(event)">
        <div class="preview-container" id="upload-preview"></div>
        
        <textarea id="post-caption" rows="4" placeholder="문구를 작성하세요..."></textarea>
        
        <label>작성 날짜 지정 (옛날 게시물일 경우 선택)</label>

  <script>
    /* ==============================================================
       1. 산업 표준 Key-Value DB 엔진
       ============================================================== */
    const DB_NAME = "InstaPermanentStorage_v1";
    const DB_STORE = "keyval";

    const Storage = {
      _getDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(DB_STORE)) {
              req.result.createObjectStore(DB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },

      async set(key, val) {
        try {
          const db = await this._getDB();
          await new Promise((res, rej) => {
            const tx = db.transaction(DB_STORE, "readwrite");
            tx.objectStore(DB_STORE).put(val, key);
            tx.oncomplete = () => res();
            tx.onerror = () => rej(tx.error);
          });
        } catch (e) {
          console.error("DB write error:", e);
        }

        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      },

      async get(key, fallback) {
        try {
          const db = await this._getDB();
          const data = await new Promise((res) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const req = tx.objectStore(DB_STORE).get(key);
            req.onsuccess = () => res(req.result);
            req.onerror = () => res(null);
          });
          if (data !== undefined && data !== null) {
            return data;
          }
        } catch (e) {}

        try {
          const local = localStorage.getItem(key);
          if (local) {
            const parsed = JSON.parse(local);
            this.set(key, parsed);
            return parsed;
          }
        } catch (e) {}

        return fallback;
      }
    };

    /* 고화질 스마트 압축 엔진 */
    function compressHighQuality(file, maxDimension = 1080, quality = 0.82) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            canvas.width = width;
            canvas.height = height;

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            ctx.drawImage(img, 0, 0, width, height);

            let finalDataUrl = canvas.toDataURL("image/webp", quality);
            if (!finalDataUrl.startsWith("data:image/webp")) {
              finalDataUrl = canvas.toDataURL("image/jpeg", quality);
            }
            resolve(finalDataUrl);
          };
        };
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toastBox");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }

    function dummyTab(name) {
      showToast(`${name} 탭은 준비 중입니다.`);
    }

    /* 화면 전환 */
    function switchView(viewName) {
      document.querySelectorAll(".page-view").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".nav-tab-item").forEach(el => el.classList.remove("active"));

      if (viewName === 'home') {
        document.getElementById("view-home").classList.add("active");
        document.getElementById("tab-btn-home").classList.add("active");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else if (viewName === 'profile') {
        document.getElementById("view-profile").classList.add("active");
        document.getElementById("tab-btn-profile").classList.add("active");
        renderMyProfilePage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    /* ==============================================================
       2. 전역 상태 및 디스크 로드 (팔로워 1000~3000, 팔로잉 300~400)
       ============================================================== */
    const DEFAULT_PROFILE = {
      username: "my_insta_id",
      name: "내 이름",
      bio: "내 인스타그램 홈에 오신 것을 환영합니다 📷✨",
      avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80",
      followers: 1842, // 1000~3000 사이 기본값
      following: 358   // 300~400 사이 기본값
    };

    let profileData = DEFAULT_PROFILE;
    let postsList = [];
    let storiesList = [];
    let highlightsList = [];

    let currentFeedImages = [];
    let currentStoryImages = [];
    let currentHighlightImages = [];
    let currentEditStoryImages = [];
    let selectedPostId = null;

    async function initApp() {
      const savedProfile = await Storage.get("profile", DEFAULT_PROFILE);
      
      profileData = {
        username: savedProfile.username || savedProfile.name || "my_insta_id",
        name: savedProfile.name && savedProfile.username ? savedProfile.name : (savedProfile.name || "내 이름"),
        bio: savedProfile.bio !== undefined ? savedProfile.bio : DEFAULT_PROFILE.bio,
        avatar: savedProfile.avatar || DEFAULT_PROFILE.avatar,
        // 1000~3000 사이 팔로워, 300~400 사이 팔로잉 유지
        followers: savedProfile.followers || 1842,
        following: savedProfile.following || 358
      };

      postsList = await Storage.get("posts", []);
      storiesList = await Storage.get("stories", []);
      highlightsList = await Storage.get("highlights", []);

      // 기존 게시물에 likesCount가 없으면 500~700 사이 랜덤 부여
      postsList.forEach(post => {
        if (!post.likesCount) {
          post.likesCount = Math.floor(Math.random() * (700 - 500 + 1)) + 500;
          post.isLiked = false;
        }
      });

      postsList.sort((a, b) => b.createdAt - a.createdAt);

      renderStories();
      renderFeed();
      renderMyProfilePage();

      if (postsList.length > 0 || storiesList.length > 0) {
        showToast(`💾 복원 완료: 게시물 ${postsList.length}개 / 스토리 ${storiesList.length}개`);
      }
    }

    function renderMyProfilePage() {
      document.getElementById("page-profile-header-username").textContent = profileData.username;
      document.getElementById("mypage-name").textContent = profileData.name;
      document.getElementById("mypage-bio").textContent = profileData.bio;
      document.getElementById("mypage-avatar").src = profileData.avatar;
      document.getElementById("nav-avatar").src = profileData.avatar;
      document.getElementById("mypage-post-count").textContent = postsList.length;

      // 팔로워 & 팔로잉 수치 세팅 (콤마 포맷)
      document.getElementById("mypage-followers-count").textContent = Number(profileData.followers).toLocaleString();
      document.getElementById("mypage-following-count").textContent = Number(profileData.following).toLocaleString();

      renderHighlights();

      const grid = document.getElementById("profile-grid-feed");
      grid.innerHTML = "";

      if (postsList.length === 0) {
        grid.innerHTML = `<div style="grid-column: span 3; text-align:center; padding: 40px 10px; color:#8e8e8e; font-size:14px;">등록된 게시물이 없습니다.</div>`;
        return;
      }

      postsList.forEach(post => {
        const item = document.createElement("div");
        item.className = "grid-item";
        item.onclick = () => openPostDetailModal(post.id);

        const multiIcon = post.images.length > 1 ? `<i class="fa-solid fa-clone"></i>` : '';
        const hiddenIcon = post.hideFromHome ? `<i class="fa-solid fa-box-archive" title="홈에 숨겨진 게시물"></i>` : '';

        item.innerHTML = `
          <img src="${post.images[0]}" alt="게시물 사진">
          <div class="badge-icons">
            ${hiddenIcon}
            ${multiIcon}
          </div>
        `;
        grid.appendChild(item);
      });
    }

    /* 그리드 전용 상세 보기 모달 */
    function openPostDetailModal(postId) {
      selectedPostId = postId;
      const post = postsList.find(p => p.id === postId);
      if (!post) return;

      const container = document.getElementById("post-detail-body");
      container.innerHTML = "";

      const card = createPostCardElement(post);
      container.appendChild(card);

      openModal("postDetailModal");
    }

    function openDetailPostOptions() {
      openOptionsMenu(selectedPostId);
    }

    /* ==============================================================
       3. 하이라이트 기능
       ============================================================== */
    function renderHighlights() {
      const container = document.getElementById("highlights-container");
      container.innerHTML = "";

      const addBtn = document.createElement("div");
      addBtn.className = "highlight-item";
      addBtn.onclick = () => openModal("highlightUploadModal");
      addBtn.innerHTML = `
        <div class="highlight-circle add-circle">
          <i class="fa-solid fa-plus"></i>
        </div>
        <span class="highlight-title">신규</span>
      `;
      container.appendChild(addBtn);

      highlightsList.forEach((hl, idx) => {
        const item = document.createElement("div");
        item.className = "highlight-item";
        item.onclick = () => openHighlightViewer(idx);
        item.innerHTML = `
          <div class="highlight-circle">
            <img src="${hl.cover}" alt="${hl.title}">
          </div>
          <span class="highlight-title">${escapeHtml(hl.title)}</span>
        `;
        container.appendChild(item);
      });
    }

    async function handleHighlightImageSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      currentHighlightImages = [];
      const preview = document.getElementById("highlight-upload-preview");
      preview.innerHTML = `<p style='font-size:12px;color:#888;'>고화질 압축 중 (총 ${files.length}장)...</p>`;

      let idx = 0;
      for (let file of files) {
        idx++;
        preview.innerHTML = `<p style='font-size:12px;color:#0095f6;'>고화질 압축 중 (${idx}/${files.length})...</p>`;
        const compressed = await compressHighQuality(file, 1080, 0.82);
        currentHighlightImages.push(compressed);
      }
      preview.innerHTML = "";
      currentHighlightImages.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        preview.appendChild(img);
      });
    }

    async function submitHighlight() {
      const titleInput = document.getElementById("highlight-title-input").value.trim();
      const coverInput = document.getElementById("highlight-cover-input");
      const title = titleInput || "하이라이트";

      if (currentHighlightImages.length === 0) {
        alert("최소 1장의 사진을 등록해주세요.");
        return;
      }

      let coverUrl = currentHighlightImages[0];
      if (coverInput.files.length > 0) {
        coverUrl = await compressHighQuality(coverInput.files[0], 300, 0.85);
      }

      const newHighlight = {
        id: "hl_" + Date.now(),
        title: title,
        cover: coverUrl,
        images: currentHighlightImages,
        createdAt: Date.now()
      };

      highlightsList.unshift(newHighlight);
      await Storage.set("highlights", highlightsList);

      closeModal("highlightUploadModal");
      document.getElementById("highlight-title-input").value = "";
      coverInput.value = "";
      document.getElementById("highlight-images-input").value = "";
      document.getElementById("highlight-upload-preview").innerHTML = "";
      currentHighlightImages = [];

      renderHighlights();
      showToast("하이라이트가 고화질로 저장되었습니다!");
    }

    /* ==============================================================
       4. 스토리 기능
       ============================================================== */
    function renderStories() {
      const container = document.getElementById("stories-container");
      container.innerHTML = "";

      const myStoryIndex = storiesList.findIndex(s => s.isMine);
      const myStory = myStoryIndex !== -1 ? storiesList[myStoryIndex] : null;

      const myStoryEl = document.createElement("div");
      myStoryEl.className = "story-item";
      
      if (myStory) {
        myStoryEl.onclick = () => openStoryViewer(myStoryIndex);
        myStoryEl.innerHTML = `
          <div class="story-ring">
            <img src="${profileData.avatar}" alt="내 스토리">
          </div>
          <span class="story-username">내 스토리</span>
        `;
      } else {
        myStoryEl.onclick = () => openStoryUploadModal('my');
        myStoryEl.innerHTML = `
          <div class="story-ring no-story">
            <img src="${profileData.avatar}" alt="내 스토리">
            <div class="add-icon-badge"><i class="fa-solid fa-plus"></i></div>
          </div>
          <span class="story-username">내 스토리</span>
        `;
      }
      container.appendChild(myStoryEl);

      storiesList.forEach((story, idx) => {
        if (story.isMine) return;
        const item = document.createElement("div");
        item.className = "story-item";
        item.onclick = () => openStoryViewer(idx);
        item.innerHTML = `
          <div class="story-ring">
            <img src="${story.avatar}" alt="${story.username}">
          </div>
          <span class="story-username">${escapeHtml(story.username)}</span>
        `;
        container.appendChild(item);
      });
    }

    function openStoryUploadModal(type = 'other') {
      if (type === 'my') {
        document.getElementById("storyTypeMy").checked = true;
      } else {
        document.getElementById("storyTypeOther").checked = true;
      }
      toggleStoryTypeUI();
      openModal('storyUploadModal');
    }

    function toggleStoryTypeUI() {
      const isMy = document.getElementById("storyTypeMy").checked;
      document.getElementById("other-user-fields").style.display = isMy ? "none" : "block";
    }

    async function handleStoryImageSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      currentStoryImages = [];
      const preview = document.getElementById("story-upload-preview");
      preview.innerHTML = `<p style='font-size:12px;color:#888;'>스토리 고화질 압축 중 (총 ${files.length}장)...</p>`;

      let idx = 0;
      for (let file of files) {
        idx++;
        preview.innerHTML = `<p style='font-size:12px;color:#0095f6;'>고화질 압축 중 (${idx}/${files.length})...</p>`;
        const compressed = await compressHighQuality(file, 1080, 0.82);
        currentStoryImages.push(compressed);
      }
      preview.innerHTML = "";
      currentStoryImages.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        preview.appendChild(img);
      });
    }

    async function submitStory() {
      const isMy = document.getElementById("storyTypeMy").checked;
      let username = "";
      let avatarUrl = "";

      if (isMy) {
        username = profileData.username;
        avatarUrl = profileData.avatar;
      } else {
        username = document.getElementById("story-username").value.trim();
        const profileInput = document.getElementById("story-profile-img");
        if (!username) {
          alert("계정 아이디를 입력해주세요.");
          return;
        }
        avatarUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=random`;
        if (profileInput.files.length > 0) {
          avatarUrl = await compressHighQuality(profileInput.files[0], 250, 0.85);
        }
      }

      if (currentStoryImages.length === 0) {
        alert("최소 1장의 스토리 사진을 등록해주세요.");
        return;
      }

      if (isMy) {
        storiesList = storiesList.filter(s => !s.isMine);
      }

      const newStory = {
        id: "story_" + Date.now(),
        isMine: isMy,
        username: username,
        avatar: avatarUrl,
        images: currentStoryImages,
        createdAt: Date.now()
      };

      if (isMy) {
        storiesList.unshift(newStory);
      } else {
        storiesList.push(newStory);
      }

      await Storage.set("stories", storiesList);

      closeModal("storyUploadModal");
      document.getElementById("story-username").value = "";
      document.getElementById("story-profile-img").value = "";
      document.getElementById("story-images").value = "";
      document.getElementById("story-upload-preview").innerHTML = "";
      currentStoryImages = [];

      renderStories();
      showToast(`스토리가 고화질로 영구 저장되었습니다! (총 ${storiesList.length}개)`);
    }

    /* 뷰어 제어 */
    let viewerMode = 'story';
    let activeItemIdx = 0;
    let activeSlideIdx = 0;

    function openStoryViewer(idx) {
      viewerMode = 'story';
      activeItemIdx = idx;
      activeSlideIdx = 0;
      document.getElementById("viewer-btn-edit").style.display = "block";
      updateViewer();
      document.getElementById("storyViewerModal").classList.add("active");
    }

    function openHighlightViewer(idx) {
      viewerMode = 'highlight';
      activeItemIdx = idx;
      activeSlideIdx = 0;
      document.getElementById("viewer-btn-edit").style.display = "none";
      updateViewer();
      document.getElementById("storyViewerModal").classList.add("active");
    }

    function closeViewer() {
      document.getElementById("storyViewerModal").classList.remove("active");
    }

    function updateViewer() {
      const currentList = viewerMode === 'story' ? storiesList : highlightsList;
      const item = currentList[activeItemIdx];
      if (!item) return closeViewer();

      if (viewerMode === 'story') {
        document.getElementById("viewer-username").textContent = item.username;
        document.getElementById("viewer-profile-img").src = item.avatar;
      } else {
        document.getElementById("viewer-username").textContent = item.title;
        document.getElementById("viewer-profile-img").src = item.cover;
      }

      document.getElementById("viewer-img").src = item.images[activeSlideIdx];

      const bars = document.getElementById("storyBars");
      bars.innerHTML = "";
      item.images.forEach((_, i) => {
        const b = document.createElement("div");
        b.className = "story-bar" + (i <= activeSlideIdx ? " active" : "");
        bars.appendChild(b);
      });
    }

    function prevSlide() {
      if (activeSlideIdx > 0) {
        activeSlideIdx--;
        updateViewer();
      } else if (activeItemIdx > 0) {
        activeItemIdx--;
        const currentList = viewerMode === 'story' ? storiesList : highlightsList;
        activeSlideIdx = currentList[activeItemIdx].images.length - 1;
        updateViewer();
      }
    }

    function nextSlide() {
      const currentList = viewerMode === 'story' ? storiesList : highlightsList;
      const item = currentList[activeItemIdx];
      if (activeSlideIdx < item.images.length - 1) {
        activeSlideIdx++;
        updateViewer();
      } else if (activeItemIdx < currentList.length - 1) {
        activeItemIdx++;
        activeSlideIdx = 0;
        updateViewer();
      } else {
        closeViewer();
      }
    }

    async function deleteCurrentViewerItem() {
      if (viewerMode === 'story') {
        const story = storiesList[activeItemIdx];
        if (!story) return;
        if (confirm(`@${story.username} 님의 스토리를 삭제하시겠습니까?`)) {
          storiesList.splice(activeItemIdx, 1);
          await Storage.set("stories", storiesList);
          closeViewer();
          renderStories();
          showToast("스토리가 삭제되었습니다.");
        }
      } else {
        const hl = highlightsList[activeItemIdx];
        if (!hl) return;
        if (confirm(`'${hl.title}' 하이라이트를 삭제하시겠습니까?`)) {
          highlightsList.splice(activeItemIdx, 1);
          await Storage.set("highlights", highlightsList);
          closeViewer();
          renderHighlights();
          showToast("하이라이트가 삭제되었습니다.");
        }
      }
    }

    function openCurrentStoryEditModal() {
      const story = storiesList[activeItemIdx];
      if (!story) return;
      document.getElementById("edit-story-username").value = story.username;
      currentEditStoryImages = [...story.images];
      renderStoryEditPreview();
      openModal("storyEditModal");
    }

    function renderStoryEditPreview() {
      const preview = document.getElementById("story-edit-preview");
      preview.innerHTML = "";
      currentEditStoryImages.forEach((src, idx) => {
        const div = document.createElement("div");
        div.style.position = "relative";
        div.innerHTML = `
          <img src="${src}" style="width:60px; height:60px; object-fit:cover; border-radius:4px;">
          <span onclick="removeEditStorySlide(${idx})" style="position:absolute;top:-4px;right:-4px;background:red;color:white;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;">&times;</span>
        `;
        preview.appendChild(div);
      });
    }

    function removeEditStorySlide(idx) {
      if (currentEditStoryImages.length <= 1) {
        alert("스토리 사진은 최소 1장이 남아있어야 합니다.");
        return;
      }
      currentEditStoryImages.splice(idx, 1);
      renderStoryEditPreview();
    }

    async function handleStoryEditImageSelect(e) {
      const files = Array.from(e.target.files);
      for (let file of files) {
        const compressed = await compressHighQuality(file, 1080, 0.82);
        currentEditStoryImages.push(compressed);
      }
      renderStoryEditPreview();
      e.target.value = "";
    }

    async function saveStoryEdit() {
      const story = storiesList[activeItemIdx];
      if (!story) return;
      const newUsername = document.getElementById("edit-story-username").value.trim();
      if (!newUsername) {
        alert("계정 아이디를 입력해주세요.");
        return;
      }

      story.username = newUsername;
      story.images = currentEditStoryImages;

      await Storage.set("stories", storiesList);
      closeModal("storyEditModal");
      updateViewer();
      renderStories();
      showToast("스토리가 고화질로 저장되었습니다!");
    }

    /* ==============================================================
       5. 피드 기능 (하트 500~700개 자동 부여 및 인터랙션)
       ============================================================== */
    function openPostUploadModal(isOldPostMode = false) {
      const checkbox = document.getElementById("post-hide-from-home");
      const title = document.getElementById("upload-modal-title");
      const dateInput = document.getElementById("post-custom-date");

      if (isOldPostMode) {
        checkbox.checked = true;
        title.textContent = "옛날 게시물 올리기 (내 계정에만 표시)";
      } else {
        checkbox.checked = false;
        title.textContent = "새 피드 작성";
      }
      dateInput.value = "";
      openModal("uploadModal");
    }

    async function handleFeedImageSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      currentFeedImages = [];
      const preview = document.getElementById("upload-preview");
      preview.innerHTML = `<p style='font-size:12px;color:#888;'>고화질 스마트 압축 중 (총 ${files.length}장)...</p>`;

      let idx = 0;
      for (let file of files) {
        idx++;
        preview.innerHTML = `<p style='font-size:12px;color:#0095f6;'>고화질 압축 중 (${idx}/${files.length})...</p>`;
        const compressed = await compressHighQuality(file, 1080, 0.82);
        currentFeedImages.push(compressed);
      }
      preview.innerHTML = "";
      currentFeedImages.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        preview.appendChild(img);
      });
    }

    async function submitPost() {
      const caption = document.getElementById("post-caption").value;
      const hideFromHome = document.getElementById("post-hide-from-home").checked;
      const dateInputValue = document.getElementById("post-custom-date").value;

      if (currentFeedImages.length === 0) {
        alert("최소 1장의 사진을 등록해주세요.");
        return;
      }

      let postTime = Date.now();
      if (dateInputValue) {
        postTime = new Date(dateInputValue).getTime();
      }

      // 게시물 하트 수: 500~700개 사이 무작위 생성
      const initialLikes = Math.floor(Math.random() * (700 - 500 + 1)) + 500;

      const newPost = {
        id: "post_" + Date.now(),
        images: currentFeedImages,
        caption: caption,
        hideFromHome: hideFromHome,
        likesCount: initialLikes,
        isLiked: false,
        createdAt: postTime
      };

      postsList.push(newPost);
      postsList.sort((a, b) => b.createdAt - a.createdAt);

      await Storage.set("posts", postsList);

      closeModal("uploadModal");
      document.getElementById("post-images").value = "";
      document.getElementById("post-caption").value = "";
      document.getElementById("post-custom-date").value = "";
      document.getElementById("upload-preview").innerHTML = "";
      currentFeedImages = [];

      renderFeed();
      renderMyProfilePage();

      if (hideFromHome) {
        showToast("홈에 안 뜨고 내 계정에만 고화질로 저장되었습니다!");
      } else {
        showToast(`게시물이 등록되었습니다! (좋아요 ${initialLikes}개)`);
      }
    }

    // 하트 토글 함수
    async function togglePostLike(postId, iconEl) {
      const post = postsList.find(p => p.id === postId);
      if (!post) return;

      post.isLiked = !post.isLiked;
      post.likesCount += post.isLiked ? 1 : -1;

      await Storage.set("posts", postsList);

      // 전체 렌더링을 가볍게 갱신
      renderFeed();
      // 만약 상세 보기 모달이 열려있다면 모달 내부 카드도 갱신
      const detailBody = document.getElementById("post-detail-body");
      if (detailBody && selectedPostId === postId) {
        detailBody.innerHTML = "";
        detailBody.appendChild(createPostCardElement(post));
      }
    }

    function createPostCardElement(post) {
      const postEl = document.createElement("article");
      postEl.className = "post-card";
      postEl.id = `post-${post.id}`;

      let slidesHtml = post.images.map(img => `<img src="${img}" alt="사진">`).join("");
      let badgeHtml = post.images.length > 1 ? `<div class="slide-badge">1 / ${post.images.length}</div>` : '';
      let hiddenBadge = post.hideFromHome ? `<span class="post-badge-hidden"><i class="fa-solid fa-box-archive"></i> 내 계정 전용</span>` : '';

      const dateStr = new Date(post.createdAt).toLocaleDateString("ko-KR", {
        year: 'numeric', month: 'long', day: 'numeric'
      });

      const heartClass = post.isLiked ? "fa-solid fa-heart active" : "fa-regular fa-heart";
      const likesNum = (post.likesCount || 520).toLocaleString();

      postEl.innerHTML = `
        <div class="post-header">
          <div class="post-user">
            <img src="${profileData.avatar}" alt="프로필">
            <span>${profileData.username}</span>
            ${hiddenBadge}
          </div>
          <button class="post-menu-btn" onclick="openOptionsMenu('${post.id}')">
            <i class="fa-solid fa-ellipsis"></i>
          </button>
        </div>
        <div class="post-slider-wrap">
          <div class="post-slider" onscroll="updateSliderBadge(this)">
            ${slidesHtml}
          </div>
          ${badgeHtml}
        </div>
        <div class="post-actions">
          <i class="${heartClass}" onclick="togglePostLike('${post.id}', this)"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <!-- 500~700개 하트 수 노출 -->
        <div class="post-likes">좋아요 <span>${likesNum}</span>개</div>
        <div class="post-body">
          <div><strong>${profileData.username}</strong> <span class="post-caption">${escapeHtml(post.caption)}</span></div>
          <div class="post-date">${dateStr}</div>
        </div>
      `;
      return postEl;
    }

    function renderFeed() {
      const feed = document.getElementById("feed-container");
      feed.innerHTML = "";

      const visiblePosts = postsList.filter(p => !p.hideFromHome);

      if (visiblePosts.length === 0) {
        feed.innerHTML = `<div style="text-align:center; padding:60px 20px; color:#8e8e8e;">홈 피드에 표시된 게시물이 없습니다. 상단 '피드 작성'을 눌러 첫 글을 올려보세요!</div>`;
        return;
      }

      visiblePosts.forEach(post => {
        const postEl = createPostCardElement(post);
        feed.appendChild(postEl);
      });
    }

    function updateSliderBadge(slider) {
      const badge = slider.nextElementSibling;
      if (!badge) return;
      const index = Math.round(slider.scrollLeft / slider.clientWidth) + 1;
      const total = slider.children.length;
      badge.textContent = `${index} / ${total}`;
    }

    function openOptionsMenu(id) {
      selectedPostId = id;
      openModal("optionsModal");
    }

    async function deleteCurrentPost() {
      if (confirm("정말로 이 게시글을 삭제하시겠습니까?")) {
        postsList = postsList.filter(p => p.id !== selectedPostId);
        await Storage.set("posts", postsList);
        closeModal("optionsModal");
        closeModal("postDetailModal");
        renderFeed();
        renderMyProfilePage();
        showToast("게시글이 삭제되었습니다.");
      }
    }

    function openEditModal() {
      closeModal("optionsModal");
      const post = postsList.find(p => p.id === selectedPostId);
      if (post) {
        document.getElementById("edit-caption").value = post.caption;
        document.getElementById("edit-hide-from-home").checked = !!post.hideFromHome;
        
        const d = new Date(post.createdAt);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        document.getElementById("edit-custom-date").value = `${yyyy}-${mm}-${dd}`;

        openModal("editModal");
      }
    }

    async function savePostEdit() {
      const newCaption = document.getElementById("edit-caption").value;
      const newHide = document.getElementById("edit-hide-from-home").checked;
      const dateVal = document.getElementById("edit-custom-date").value;

      const post = postsList.find(p => p.id === selectedPostId);
      if (post) {
        post.caption = newCaption;
        post.hideFromHome = newHide;
        if (dateVal) {
          post.createdAt = new Date(dateVal).getTime();
        }

        postsList.sort((a, b) => b.createdAt - a.createdAt);
        await Storage.set("posts", postsList);

        closeModal("editModal");
        closeModal("postDetailModal");
        renderFeed();
        renderMyProfilePage();
        showToast("게시글이 수정되었습니다!");
      }
    }

    /* ==============================================================
       6. 내 계정 프로필 편집 (팔로워 / 팔로잉 포함)
       ============================================================== */
    function openProfileModal() {
      document.getElementById("edit-username").value = profileData.username;
      document.getElementById("edit-name").value = profileData.name;
      document.getElementById("edit-bio").value = profileData.bio;
      document.getElementById("edit-followers").value = profileData.followers;
      document.getElementById("edit-following").value = profileData.following;
      openModal("profileModal");
    }

    async function saveProfile() {
      const username = document.getElementById("edit-username").value.trim();
      const name = document.getElementById("edit-name").value.trim();
      const bio = document.getElementById("edit-bio").value.trim();
      const followers = document.getElementById("edit-followers").value;
      const following = document.getElementById("edit-following").value;
      const fileInput = document.getElementById("profile-image-input");

      if (!username) {
        alert("계정 아이디를 입력해주세요.");
        return;
      }

      profileData.username = username;
      profileData.name = name || username;
      profileData.bio = bio;
      if (followers) profileData.followers = parseInt(followers, 10);
      if (following) profileData.following = parseInt(following, 10);

      if (fileInput.files.length > 0) {
        profileData.avatar = await compressHighQuality(fileInput.files[0], 300, 0.85);
      }

      await Storage.set("profile", profileData);

      renderStories();
      renderFeed();
      renderMyProfilePage();
      closeModal("profileModal");
      fileInput.value = "";
      showToast("프로필 및 팔로워 정보가 저장되었습니다!");
    }

    /* ==============================================================
       7. 백업 및 복원
       ============================================================== */
    function exportDataBackup() {
      const backupData = {
        profile: profileData,
        posts: postsList,
        stories: storiesList,
        highlights: highlightsList,
        version: "7.0"
      };
      const blob = new Blob([JSON.stringify(backupData)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `instagram_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("백업 파일이 다운로드되었습니다.");
    }

    function importDataBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.profile) profileData = data.profile;
          if (data.posts) postsList = data.posts;
          if (data.stories) storiesList = data.stories;
          if (data.highlights) highlightsList = data.highlights;

          await Storage.set("profile", profileData);
          await Storage.set("posts", postsList);
          await Storage.set("stories", storiesList);
          await Storage.set("highlights", highlightsList);

          renderStories();
          renderFeed();
          renderMyProfilePage();
          showToast("성공적으로 복구되었습니다!");
        } catch (err) {
          alert("유효하지 않은 백업 파일입니다.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function openModal(id) { document.getElementById(id).classList.add("active"); }
    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 실행
    window.onload = initApp;
  </script>
</body>
