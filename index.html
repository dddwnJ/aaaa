<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <!-- 폰트 및 아이콘 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #fafafa;
      color: #262626;
      padding-bottom: 75px;
    }

    .page-view {
      display: none;
      max-width: 600px;
      margin: 0 auto;
    }
    .page-view.active {
      display: block;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid #dbdbdb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -0.5px;
    }
    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .header-btn {
      background: #efefef;
      border: 1px solid #dbdbdb;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header-btn.highlight {
      background: #0095f6;
      color: white;
      border-color: #0095f6;
    }

    /* 스토리 바 */
    .stories-container {
      background: #ffffff;
      border-bottom: 1px solid #dbdbdb;
      padding: 12px 10px;
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stories-container::-webkit-scrollbar {
      display: none;
    }
    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 66px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5px;
      position: relative;
    }
    .story-ring.no-story {
      background: #dbdbdb;
    }
    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      border: 2px solid #fff;
    }
    .add-icon-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #0095f6;
      color: #fff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border: 2px solid #fff;
    }
    .story-username {
      font-size: 11px;
      margin-top: 5px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 피드 */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px 0;
    }
    .post-card {
      background: #ffffff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      overflow: hidden;
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    .post-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .post-user img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .post-user span {
      font-weight: 600;
      font-size: 14px;
    }
    .post-badge-hidden {
      font-size: 10px;
      background: #eee;
      color: #666;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .post-menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #262626;
      padding: 4px;
      font-size: 16px;
    }
    .post-slider-wrap {
      position: relative;
      width: 100%;
      background: #000;
    }
    .post-slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .post-slider::-webkit-scrollbar {
      display: none;
    }
    .post-slider img {
      width: 100%;
      flex-shrink: 0;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      scroll-snap-align: start;
    }
    .slide-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      pointer-events: none;
    }
    .post-actions {
      padding: 10px 16px 4px;
      display: flex;
      gap: 16px;
      font-size: 20px;
    }
    .post-actions i {
      cursor: pointer;
    }
    .post-actions .fa-heart.active {
      color: #ed4956;
    }
    .post-likes {
      padding: 0 16px;
      font-size: 13.5px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #262626;
    }
    .post-body {
      padding: 0 16px 14px;
      font-size: 14px;
    }
    .post-caption {
      margin-top: 4px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .post-date {
      margin-top: 6px;
      font-size: 11px;
      color: #8e8e8e;
    }

    /* 내 프로필 뷰 */
    .profile-header-bar {
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .my-profile-section {
      background: #ffffff;
      padding: 18px 16px 12px;
    }
    .profile-top-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 14px;
    }
    .my-profile-avatar {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #dbdbdb;
    }
    .profile-stats {
      display: flex;
      flex: 1;
      justify-content: space-around;
      text-align: center;
    }
    .stat-box .count {
      font-weight: 700;
      font-size: 16px;
      display: block;
    }
    .stat-box .label {
      font-size: 12px;
      color: #737373;
    }
    .profile-bio-wrap {
      margin-bottom: 14px;
    }
    .profile-bio-wrap h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .profile-bio-wrap p {
      font-size: 13px;
      line-height: 1.4;
      color: #262626;
      white-space: pre-line;
    }
    .profile-action-btn-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-profile-edit {
      flex: 2;
      background: #efefef;
      border: none;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-backup {
      flex: 1;
      background: #efefef;
      border: none;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    /* 하이라이트 */
    .highlights-container {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 10px 0 6px;
      border-top: 1px solid #efefef;
    }
    .highlights-container::-webkit-scrollbar {
      display: none;
    }
    .highlight-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 64px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .highlight-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid #dbdbdb;
      padding: 2.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .highlight-circle img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .highlight-circle.add-circle {
      background: #fafafa;
      border: 1px solid #c7c7c7;
      font-size: 20px;
      color: #262626;
    }
    .highlight-title {
      font-size: 11px;
      margin-top: 5px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #262626;
    }

    /* 그리드 피드 */
    .grid-tab-header {
      display: flex;
      border-top: 1px solid #dbdbdb;
      border-bottom: 1px solid #dbdbdb;
      background: #fff;
      margin-top: 6px;
    }
    .grid-tab-item {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 18px;
      border-bottom: 2px solid #262626;
      color: #262626;
      cursor: pointer;
    }
    .profile-grid-feed {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding-top: 3px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #eee;
      cursor: pointer;
      overflow: hidden;
    }
    .grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grid-item .badge-icons {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      color: white;
      font-size: 13px;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
    }

    /* 하단 네비게이션 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      height: 52px;
      background: #ffffff;
      border-top: 1px solid #dbdbdb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-tab-item {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 100%;
      color: #262626;
      font-size: 22px;
      cursor: pointer;
    }
    .nav-tab-item.active {
      font-weight: 900;
    }
    .nav-profile-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid transparent;
    }
    .nav-tab-item.active .nav-profile-avatar {
      border-color: #262626;
    }

    /* 모달 공통 */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 440px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid #dbdbdb;
      font-weight: 600;
      text-align: center;
      position: relative;
    }
    .modal-close {
      position: absolute;
      right: 16px;
      top: 14px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 18px;
    }
    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .modal-body input[type="text"], .modal-body input[type="number"], .modal-body input[type="date"], .modal-body textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .modal-body label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: -4px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row > div {
      flex: 1;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: #111;
      cursor: pointer;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .checkbox-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
    }
    .radio-group {
      display: flex;
      gap: 16px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-submit {
      background: #0095f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .preview-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0;
    }
    .preview-container img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #dbdbdb;
    }

    /* 스토리 풀스크린 뷰어 */
    .story-viewer-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 300;
      align-items: center;
      justify-content: center;
    }
    .story-viewer-modal.active {
      display: flex;
    }
    .story-viewer-content {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 820px;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-bars-wrap {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 310;
    }
    .story-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.35);
      flex: 1;
      border-radius: 2px;
    }
    .story-bar.active {
      background: #ffffff;
    }
    .story-viewer-header {
      position: absolute;
      top: 20px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      z-index: 310;
      font-size: 14px;
    }
    .story-viewer-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .story-viewer-user img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .story-viewer-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .story-nav-prev, .story-nav-next {
      position: absolute;
      top: 60px;
      bottom: 0;
      width: 50%;
      z-index: 305;
      cursor: pointer;
    }
    .story-nav-prev { left: 0; }
    .story-nav-next { right: 0; }

    /* 토스트 알림 */
    .toast-box {
      position: fixed;
      bottom: 65px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      display: none;
    }

    .option-item {
      padding: 14px;
      text-align: center;
      border: none;
      border-bottom: 1px solid #efefef;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
    }
    .option-item.danger {
      color: #ed4956;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- ==================== 1. 홈 뷰 ==================== -->
  <div id="view-home" class="page-view active">
    <header>
      <div class="logo">Instagram</div>
      <div class="nav-actions">
        <button class="header-btn highlight" onclick="openStoryUploadModal('other')">
          <i class="fa-solid fa-circle-plus"></i> 친구 스토리
        </button>
        <button class="header-btn" onclick="openPostUploadModal(false)">
          <i class="fa-regular fa-square-plus"></i> 피드 작성
        </button>
      </div>
    </header>

    <div class="stories-container" id="stories-container"></div>
    <main class="feed-container" id="feed-container"></main>
  </div>


  <!-- ==================== 2. 내 프로필 뷰 ==================== -->
  <div id="view-profile" class="page-view">
    <header>
      <div class="profile-header-bar">
        <i class="fa-solid fa-lock" style="font-size:14px;"></i>
        <span id="page-profile-header-username">my_username</span>
      </div>
      <div class="nav-actions">
        <button class="header-btn highlight" onclick="openPostUploadModal(true)" title="홈에 안 뜨는 과거/내피드 전용 게시물">
          <i class="fa-solid fa-clock-rotate-left"></i> 옛날 게시물 올리기
        </button>
        <button class="header-btn" onclick="openPostUploadModal(false)">
          <i class="fa-regular fa-square-plus"></i> 일반 올리기
        </button>
      </div>
    </header>

    <section class="my-profile-section">
      <div class="profile-top-row">
        <img id="mypage-avatar" class="my-profile-avatar" src="https://via.placeholder.com/150" alt="아바타">
        <div class="profile-stats">
          <div class="stat-box">
            <span class="count" id="mypage-post-count">0</span>
            <span class="label">게시물</span>
          </div>
          <div class="stat-box">
            <span class="count" id="mypage-followers-count">2,894</span>
            <span class="label">팔로워</span>
          </div>
          <div class="stat-box">
            <span class="count" id="mypage-following-count">358</span>
            <span class="label">팔로잉</span>
          </div>
        </div>
      </div>

      <!-- 프로필 정보: 이름(볼드) + 소개글 -->
      <div class="profile-bio-wrap">
        <h3 id="mypage-name">이름</h3>
        <p id="mypage-bio">소개글이 없습니다.</p>
      </div>

      <div class="profile-action-btn-wrap">
        <button class="btn-profile-edit" onclick="openProfileModal()">프로필 편집</button>
        <button class="btn-backup" onclick="exportDataBackup()" title="모든 데이터 파일로 저장">백업</button>
        <button class="btn-backup" onclick="document.getElementById('backup-file-input').click()" title="백업 파일 불러오기">복구</button>
        <input type="file" id="backup-file-input" accept=".json" style="display:none;" onchange="importDataBackup(event)">
      </div>

      <!-- 하이라이트 영역 -->
      <div class="highlights-container" id="highlights-container"></div>
    </section>

    <div class="grid-tab-header">
      <div class="grid-tab-item"><i class="fa-solid fa-table-cells"></i></div>
    </div>

    <!-- 3열 그리드 피드 -->
    <div class="profile-grid-feed" id="profile-grid-feed"></div>
  </div>


  <!-- ==================== 하단 네비게이션 ==================== -->
  <nav class="bottom-nav">
    <div class="nav-tab-item active" id="tab-btn-home" onclick="switchView('home')" title="홈">
      <i class="fa-solid fa-house"></i>
    </div>
    <div class="nav-tab-item" onclick="dummyTab('검색')" title="검색">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="nav-tab-item" onclick="openPostUploadModal(false)" title="피드 작성">
      <i class="fa-regular fa-square-plus"></i>
    </div>
    <div class="nav-tab-item" onclick="dummyTab('릴스')" title="릴스">
      <i class="fa-solid fa-clapperboard"></i>
    </div>
    <div class="nav-tab-item" id="tab-btn-profile" onclick="switchView('profile')" title="내 프로필">
      <img id="nav-avatar" class="nav-profile-avatar" src="https://via.placeholder.com/150" alt="프로필">
    </div>
  </nav>


  <!-- ==================== 모달 목록 ==================== -->

  <!-- 피드 작성 모달 -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="upload-modal-title">새 피드 작성</span>
        <button class="modal-close" onclick="closeModal('uploadModal')">&times;</button>
      </div>
      <div class="modal-body">
        <label>사진 선택 (여러 장 가능)</label>
        <input type="file" id="post-images" accept="image/*" multiple onchange="handleFeedImageSelect(event)">
        <div class="preview-container" id="upload-preview"></div>
        
        <textarea id="post-caption" rows="4" placeholder="문구를 작성하세요..."></textarea>
        
        <label>작성 날짜 지정 (옛날 게시물일 경우 선택)</label>
        <input type="date" id="post-custom-date">

        <label class="checkbox-label">
          <input type="checkbox" id="post-hide-from-home">

    /* ==============================================================
       1. 산업 표준 Key-Value DB 엔진
       ============================================================== */
    const DB_NAME = "InstaPermanentStorage_v1";
    const DB_STORE = "keyval";

    const Storage = {
      _getDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains(DB_STORE)) {
              req.result.createObjectStore(DB_STORE);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      },

      async set(key, val) {
        try {
          const db = await this._getDB();
          await new Promise((res, rej) => {
            const tx = db.transaction(DB_STORE, "readwrite");
            tx.objectStore(DB_STORE).put(val, key);
            tx.oncomplete = () => res();
            tx.onerror = () => rej(tx.error);
          });
        } catch (e) {
          console.error("DB write error:", e);
        }

        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      },

      async get(key, fallback) {
        try {
          const db = await this._getDB();
          const data = await new Promise((res) => {
            const tx = db.transaction(DB_STORE, "readonly");
            const req = tx.objectStore(DB_STORE).get(key);
            req.onsuccess = () => res(req.result);
            req.onerror = () => res(null);
          });
          if (data !== undefined && data !== null) {
            return data;
          }
        } catch (e) {}

        try {
          const local = localStorage.getItem(key);
          if (local) {
            const parsed = JSON.parse(local);
            this.set(key, parsed);
            return parsed;
          }
        } catch (e) {}

        return fallback;
      }
    };

    /* 고화질 스마트 압축 엔진 */
    function compressHighQuality(file, maxDimension = 1080, quality = 0.82) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            canvas.width = width;
            canvas.height = height;

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";

            ctx.drawImage(img, 0, 0, width, height);

            let finalDataUrl = canvas.toDataURL("image/webp", quality);
            if (!finalDataUrl.startsWith("data:image/webp")) {
              finalDataUrl = canvas.toDataURL("image/jpeg", quality);
            }
            resolve(finalDataUrl);
          };
        };
      });
    }
